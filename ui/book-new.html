<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>录入新图书 · 墨香斋小说租赁</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="brand"><span class="logo-icon">📚</span><div class="brand-name">墨香斋</div><div class="brand-sub">小说租赁系统</div></div>
    <nav>
      <div class="nav-group-title">工作台</div>
      <a href="index.html" class="nav-link"><span class="icon">🏠</span><span>仪表盘</span></a>
      <a href="books.html" class="nav-link"><span class="icon">📖</span><span>图书管理</span></a>
      <a href="borrow-new.html" class="nav-link"><span class="icon">➕</span><span>办理借阅</span></a>
      <a href="return-new.html" class="nav-link"><span class="icon">↩️</span><span>办理归还</span></a>
      <div class="nav-group-title">记录</div>
      <a href="borrows.html" class="nav-link"><span class="icon">📋</span><span>借阅记录</span></a>
      <a href="overdue.html" class="nav-link"><span class="icon">⚠️</span><span>逾期管理</span></a>
      <div class="nav-group-title">系统</div>
      <a href="users.html" class="nav-link"><span class="icon">👥</span><span>用户管理</span></a>
      <a href="profile.html" class="nav-link"><span class="icon">👤</span><span>个人中心</span></a>
    </nav>
    <div class="user-info"><div class="avatar">墨</div><div class="who"><span>墨守成规</span><small>系统管理员</small></div></div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="breadcrumb"><a href="books.html" style="color:#3e6b8a;text-decoration:none;">图书管理</a><span class="sep">/</span><strong>录入新图书</strong></div>
    </header>

    <main class="content">
      <div style="max-width:700px; margin:0 auto;">
        <div class="card">
          <div class="card-header"><div class="card-title">图书信息</div></div>

          <div class="form-row">
            <div class="form-group">
              <label>书名<span class="req">*</span></label>
              <input class="form-control" id="fTitle" placeholder="如：笑傲江湖">
              <div class="error-msg"></div>
            </div>
            <div class="form-group">
              <label>作者<span class="req">*</span></label>
              <input class="form-control" id="fAuthor" placeholder="如：金庸">
              <div class="error-msg"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>ISBN</label>
              <input class="form-control" id="fIsbn" placeholder="如：978-7-02-000220-7">
              <div class="error-msg"></div>
            </div>
            <div class="form-group">
              <label>分类<span class="req">*</span></label>
              <select class="form-control" id="fCat">
                <option>武侠</option><option>言情</option><option>科幻</option><option>悬疑</option><option>历史</option><option>其他</option>
              </select>
            </div>
          </div>

          <div class="form-row-3">
            <div class="form-group">
              <label>定价（元）<span class="req">*</span></label>
              <input class="form-control" id="fPrice" type="number" step="0.01" placeholder="如：45.00">
              <div class="error-msg"></div>
            </div>
            <div class="form-group">
              <label>日租金（元）<span class="req">*</span></label>
              <input class="form-control" id="fRent" type="number" step="0.01" placeholder="如：0.50">
              <div class="error-msg"></div>
            </div>
            <div class="form-group">
              <label>押金（元）<span class="req">*</span></label>
              <input class="form-control" id="fDeposit" type="number" step="0.01" placeholder="如：30.00">
              <div class="error-msg"></div>
            </div>
          </div>

          <div class="form-group">
            <label>书架位置</label>
            <input class="form-control" id="fShelf" placeholder="如：A-03-07">
            <div class="error-msg"></div>
          </div>

          <div style="display:flex; gap:12px; margin-top:24px; padding-top:20px; border-top:1px solid var(--border-light);">
            <button class="btn btn-gold btn-lg" id="btnSubmit">📥 确认录入</button>
            <a href="books.html" class="btn btn-secondary btn-lg" style="text-decoration:none;">取消</a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/app.js"></script>
<script>
(function () {
  var box = document.querySelector('.card');

  function num(el) { return parseFloat(el.value); }

  document.getElementById('btnSubmit').addEventListener('click', function () {
    clearAllErrors(box);
    var ok = true;

    var title = document.getElementById('fTitle');
    var author = document.getElementById('fAuthor');
    var price = document.getElementById('fPrice');
    var rent = document.getElementById('fRent');
    var deposit = document.getElementById('fDeposit');

    if (!title.value.trim()) { setFieldError(title, '请输入书名'); ok = false; }
    if (!author.value.trim()) { setFieldError(author, '请输入作者'); ok = false; }

    if (isNaN(num(price)) || num(price) <= 0) { setFieldError(price, '定价必须大于 0'); ok = false; }
    if (isNaN(num(rent)) || num(rent) <= 0) { setFieldError(rent, '日租金必须大于 0'); ok = false; }
    if (isNaN(num(deposit)) || num(deposit) <= 0) { setFieldError(deposit, '押金必须大于 0'); ok = false; }
    else if (!isNaN(num(price)) && num(deposit) > num(price)) { setFieldError(deposit, '押金不能超过定价'); ok = false; }

    if (!ok) { showToast('请修正表单中的错误', 'error'); return; }

    showToast('《' + title.value.trim() + '》录入成功！', 'success');
    setTimeout(function () { location.href = 'books.html'; }, 900);
  });
})();
</script>
</body>
</html>
