<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 墨香斋小说租赁</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-split">

  <!-- 左侧品牌区 -->
  <div class="auth-brand">
    <span class="ab-logo">📖</span>
    <div class="ab-name">加入墨香斋</div>
    <div class="ab-sub">XIAO SHUO ZU LIN XI TONG</div>
    <div class="ab-slogan">
      注册即享 <em>万部小说</em> 随心借阅，<br>
      武侠、科幻、悬疑、历史，应有尽有；<br>
      AI 智能推荐，懂你口味。
    </div>
    <div class="ab-deco">阅</div>
  </div>

  <!-- 右侧表单区 -->
  <div class="auth-form-side">
    <div class="auth-form-box" id="regForm">
      <div class="af-title">创建账号</div>
      <div class="af-sub">填写以下信息，开启阅读之旅</div>

      <div class="form-group">
        <label>用户名<span class="req">*</span></label>
        <input class="form-control" id="username" placeholder="3-50 个字符" autocomplete="username">
        <div class="error-msg"></div>
      </div>

      <div class="form-group">
        <label>密码<span class="req">*</span></label>
        <div class="input-wrap">
          <input class="form-control" id="password" type="password" placeholder="至少 6 位" autocomplete="new-password">
          <button class="toggle-pwd" type="button" id="togglePwd" title="显示/隐藏密码">👁</button>
        </div>
        <div class="error-msg"></div>
      </div>

      <div class="form-group">
        <label>确认密码<span class="req">*</span></label>
        <input class="form-control" id="password2" type="password" placeholder="再次输入密码" autocomplete="new-password">
        <div class="error-msg"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>联系电话</label>
          <input class="form-control" id="phone" placeholder="选填">
          <div class="error-msg"></div>
        </div>
        <div class="form-group">
          <label>电子邮箱</label>
          <input class="form-control" id="email" placeholder="选填">
          <div class="error-msg"></div>
        </div>
      </div>

      <button class="btn btn-gold btn-lg" style="width:100%; margin-top:6px;" id="btnRegister">注 册</button>

      <div style="text-align:center; margin-top:18px; font-size:13px; color:var(--text-secondary);">
        已有账号？<a href="login.html" style="color:var(--color-primary); text-decoration:none; font-weight:500;">返回登录</a>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
(function () {
  var username = document.getElementById('username');
  var password = document.getElementById('password');
  var password2 = document.getElementById('password2');
  var phone = document.getElementById('phone');
  var email = document.getElementById('email');

  document.getElementById('togglePwd').addEventListener('click', function () {
    password.type = password.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('btnRegister').addEventListener('click', function () {
    var box = document.getElementById('regForm');
    clearAllErrors(box);
    var ok = true;

    var name = username.value.trim();
    if (!name) {
      setFieldError(username, '请输入用户名'); ok = false;
    } else if (name.length < 3 || name.length > 50) {
      setFieldError(username, '用户名需 3-50 个字符'); ok = false;
    }

    if (password.value.length < 6) {
      setFieldError(password, '密码至少 6 位'); ok = false;
    }

    if (password2.value !== password.value || !password2.value) {
      setFieldError(password2, '两次输入的密码不一致'); ok = false;
    }

    var p = phone.value.trim();
    if (p && !/^1[3-9]\d{9}$/.test(p)) {
      setFieldError(phone, '手机号格式不正确'); ok = false;
    }

    var m = email.value.trim();
    if (m && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) {
      setFieldError(email, '邮箱格式不正确'); ok = false;
    }

    if (!ok) return;

    showToast('注册成功，请登录', 'success');
    setTimeout(function () {
      location.href = 'login.html?username=' + encodeURIComponent(name);
    }, 900);
  });
})();
</script>
</body>
</html>
