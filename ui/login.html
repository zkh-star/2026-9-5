<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 墨香斋小说租赁</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-split">

  <!-- 左侧品牌区 -->
  <div class="auth-brand">
    <span class="ab-logo">📚</span>
    <div class="ab-name">墨香斋</div>
    <div class="ab-sub">XIAO SHUO ZU LIN XI TONG</div>
    <div class="ab-slogan">
      一卷在手，<em>墨香盈室</em>。<br>
      万部小说，随借随还；<br>
      阅读的旅程，从这里启程。
    </div>
    <div class="ab-deco">墨</div>
  </div>

  <!-- 右侧表单区 -->
  <div class="auth-form-side">
    <div class="auth-form-box" id="loginForm">
      <div class="af-title">欢迎回来</div>
      <div class="af-sub">登录墨香斋，继续你的阅读之旅</div>

      <div class="af-demo">
        <span>💡 演示环境：任意账号密码均可登录</span>
        <a href="#" id="btnDemoFill" style="color:#9a7f47; font-weight:600; text-decoration:none; white-space:nowrap;">一键填充</a>
      </div>

      <div class="form-group">
        <label>用户名</label>
        <input class="form-control" id="username" placeholder="请输入用户名" autocomplete="username">
        <div class="error-msg"></div>
      </div>

      <div class="form-group">
        <label>密码</label>
        <div class="input-wrap">
          <input class="form-control" id="password" type="password" placeholder="请输入密码（至少 6 位）" autocomplete="current-password">
          <button class="toggle-pwd" type="button" id="togglePwd" title="显示/隐藏密码">👁</button>
        </div>
        <div class="error-msg"></div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;">
        <label style="font-size:13px; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; gap:5px;">
          <input type="checkbox" id="remember" checked>记住登录
        </label>
        <a href="#" id="forgot" style="font-size:13px; color:var(--color-primary); text-decoration:none;">忘记密码？</a>
      </div>

      <button class="btn btn-gold btn-lg" style="width:100%;" id="btnLogin">登 录</button>

      <div style="text-align:center; margin-top:18px; font-size:13px; color:var(--text-secondary);">
        还没有账号？<a href="register.html" style="color:var(--color-primary); text-decoration:none; font-weight:500;">立即注册</a>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
(function () {
  var username = document.getElementById('username');
  var password = document.getElementById('password');

  // 回填记住的用户名 / 注册跳转带来的用户名
  try {
    var qs = new URLSearchParams(location.search);
    var fromReg = qs.get('username');
    var saved = localStorage.getItem('moxiang_remember');
    if (fromReg) {
      username.value = fromReg;
    } else if (saved) {
      username.value = saved;
      document.getElementById('remember').checked = true;
    }
  } catch (e) {}

  // 密码可见切换
  document.getElementById('togglePwd').addEventListener('click', function () {
    password.type = password.type === 'password' ? 'text' : 'password';
  });

  // 一键填充演示账号
  document.getElementById('btnDemoFill').addEventListener('click', function (e) {
    e.preventDefault();
    username.value = 'admin';
    password.value = 'admin123';
    clearAllErrors(document.getElementById('loginForm'));
    showToast('已填充演示账号', 'info');
  });

  // 忘记密码
  document.getElementById('forgot').addEventListener('click', function (e) {
    e.preventDefault();
    showToast('演示环境：请联系管理员重置密码', 'info');
  });

  // 登录
  document.getElementById('btnLogin').addEventListener('click', function () {
    var box = document.getElementById('loginForm');
    clearAllErrors(box);
    var ok = true;

    if (!username.value.trim()) {
      setFieldError(username, '请输入用户名');
      ok = false;
    }
    if (password.value.length < 6) {
      setFieldError(password, '密码至少 6 位');
      ok = false;
    }
    if (!ok) return;

    // 演示模式：任意账号可登录
    var user = { username: username.value.trim(), role: '系统管理员' };
    try {
      localStorage.setItem('moxiang_user', JSON.stringify(user));
      if (document.getElementById('remember').checked) {
        localStorage.setItem('moxiang_remember', user.username);
      } else {
        localStorage.removeItem('moxiang_remember');
      }
    } catch (e) {}

    showToast('欢迎回来，' + user.username + '！', 'success');
    setTimeout(function () { location.href = 'index.html'; }, 700);
  });

  // 回车提交
  password.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('btnLogin').click();
  });
  username.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('btnLogin').click();
  });
})();
</script>
</body>
</html>
